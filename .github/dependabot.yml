version: 2
updates:
  # PHP dependencies (composer.json / composer.lock).
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      laravel:
        patterns:
          - "laravel/*"
      dev-dependencies:
        dependency-type: "development"

  # Frontend build tooling (package.json / package-lock.json — Vite, Tailwind).
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  # Base image in Dockerfile.
  # A prior bump (f2ebb3dd) went 8.3-fpm -> 8.5-fpm and merged clean, but
  # broke two independent things: several rounds of Docker build failures
  # (docker-php-ext-install issues, some genuinely Dockerfile-fixable, one
  # -- opcache -- an actual upstream PHP 8.5 change), AND, once the image
  # finally built, `composer install` itself failing outright because
  # phpoffice/phpspreadsheet 1.30.x (locked, pulled in by maatwebsite/excel
  # for the DataImport module) hard-caps `php: <8.5.0` in its own
  # composer.json -- a dependency-tree incompatibility no Dockerfile change
  # can fix. Reverted back to 8.3-fpm. Ignoring major-version bumps here
  # until phpoffice/phpspreadsheet + maatwebsite/excel are deliberately
  # upgraded past that cap as their own tested change -- see the Dockerfile
  # header comment for the full account.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "php"
        update-types: ["version-update:semver-major"]

  # Actions used by the CI workflows (tests.yml, pint.yml, phpstan.yml).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # Self-hosted AI-detector microservice (services/ai-detector/requirements.txt).
  # transformers 4.47.1 -> 5.0.0 previously broke this on startup (a v5 API
  # change our custom PreTrainedModel subclass, DesklibAIDetectionModel in
  # main.py, didn't implement) -- now fixed and running on 5.14.1, verified
  # end to end (real weight loading + correct scoring on a smoke test, see
  # requirements.txt's comment) both right after the fix and again after a
  # further 5.5.0 -> 5.14.1 minor bump. Major-version bumps stay ignored here
  # going forward regardless: this dependency has already broken a custom
  # model class across one major version, so any future major bump (6.x,
  # etc.) needs the same manual build-and-smoke-test verification before
  # merging, not an auto-merge. Patch/minor bumps within 5.x are still
  # auto-proposed.
  - package-ecosystem: "pip"
    directory: "/services/ai-detector"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "transformers"
        update-types: ["version-update:semver-major"]
