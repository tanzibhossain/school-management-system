name: Tests

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  test:
    # Pinned rather than ubuntu-latest so a runner OS migration can't change
    # the environment underneath us without a deliberate commit.
    runs-on: ubuntu-24.04

    # 8.3 = the supported floor (composer.json, cPanel hosting docs).
    # 8.5 = what the Docker image actually runs.
    strategy:
      fail-fast: false
      matrix:
        php: ["8.3", "8.5"]

    name: test (PHP ${{ matrix.php }})

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, bcmath, intl, pdo_sqlite, redis, gd, zip
          coverage: none

      - name: Copy .env
        run: cp .env.example .env

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Generate application key
        run: php artisan key:generate

      # phpunit.xml points DB/cache/session/queue at in-memory drivers, so no
      # MySQL/Redis services are needed to run the suite in CI.
      - name: Run test suite
        run: php artisan test
